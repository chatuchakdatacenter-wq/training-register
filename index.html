<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตารางสมัครเรียน | ศูนย์ฝึกอาชีพจตุจักร</title>
<style>
body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#eef5f1;
  color:#16352d;
  padding:16px;
}
.hero{
  background:linear-gradient(135deg,#005C46,#047857);
  color:white;
  padding:24px;
  border-radius:24px;
}
.card{
  background:white;
  border-radius:18px;
  padding:16px;
  margin-top:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}
.tabs{
  display:flex;
  gap:10px;
  margin:16px 0;
}
button{
  border:none;
  border-radius:14px;
  padding:12px 16px;
  font-weight:bold;
}
.active{
  background:#005C46;
  color:white;
}
</style>
</head>
<body>

<div class="hero">
  <h1>ตารางสมัครเรียน</h1>
  <p>ศูนย์ฝึกอาชีพกรุงเทพมหานคร เขตจตุจักร</p>
</div>

<div class="tabs">
  <button class="active">จันทร์–ศุกร์</button>
  <button>เสาร์–อาทิตย์</button>
</div>

<div class="card">
  <h2>วิชานวดไทยเพื่อสุขภาพ</h2>
  <p>จำนวนรับ: 20 คน</p>
  <p>สมัครแล้ว: 18 คน</p>
  <p>คงเหลือ: 2 คน</p>
  <strong>สถานะ: ใกล้เต็ม</strong>
</div>

<div class="card">
  <h2>วิชาคอมพิวเตอร์เบื้องต้น</h2>
  <p>จำนวนรับ: 20 คน</p>
  <p>สมัครแล้ว: 9 คน</p>
  <p>คงเหลือ: 11 คน</p>
  <strong>สถานะ: สมัครได้</strong>
</div>

</body>
</html>
