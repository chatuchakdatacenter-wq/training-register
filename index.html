<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตารางสมัครเรียน | ศูนย์ฝึกอาชีพจตุจักร</title>

<style>
body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#eef5f1;
  color:#16352d;
  padding:16px;
}

.hero{
  background:linear-gradient(135deg,#005C46,#047857);
  color:white;
  padding:24px;
  border-radius:24px;
}

.tabs{
  display:flex;
  gap:10px;
  margin:18px 0;
}

.tab{
  border:none;
  padding:12px 18px;
  border-radius:14px;
  font-weight:bold;
  background:white;
  cursor:pointer;
}

.tab.active{
  background:#005C46;
  color:white;
}

.grid{
  display:grid;
  gap:14px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.status{
  margin-top:10px;
  font-weight:bold;
}

.green{color:#16a34a;}
.orange{color:#ea580c;}
.red{color:#dc2626;}

.loading{
  text-align:center;
  padding:40px;
}
</style>
</head>
<body>

<div class="hero">
  <h1>ตารางสมัครเรียน</h1>
  <p>ศูนย์ฝึกอาชีพกรุงเทพมหานคร เขตจตุจักร</p>
</div>

<div class="tabs">
  <button class="tab active" onclick="setType('MF',this)">
    จันทร์–ศุกร์
  </button>

  <button class="tab" onclick="setType('SS',this)">
    เสาร์–อาทิตย์
  </button>
</div>

<div id="app" class="grid">
  <div class="loading">กำลังโหลดข้อมูล...</div>
</div>

<script>

const API =
'https://script.google.com/macros/s/AKfycbyhTOS2x9xKLCCWTlXpfYRd1_tysMu2aVge8i9r8ag1Fri3jteaRWkoZx5xVp38D3kd/exec';

let allData = [];
let currentType = 'MF';

async function loadData(){

  const res = await fetch(API);
  allData = await res.json();

  render();
}

function setType(type,btn){

  currentType = type;

  document.querySelectorAll('.tab')
    .forEach(t=>t.classList.remove('active'));

  btn.classList.add('active');

  render();
}

function render(){

  const app = document.getElementById('app');

  const rows = allData.filter(
    x => x.type === currentType
  );

  if(rows.length===0){
    app.innerHTML = '<div class="card">ไม่มีข้อมูล</div>';
    return;
  }

  app.innerHTML = rows.map(r=>{

    const left = Number(r.cap) - Number(r.reg);

    let status = '';
    let cls = '';

    if(left<=0){
      status = 'เต็มแล้ว';
      cls='red';
    }
    else if(left<=3){
      status = 'ใกล้เต็ม';
      cls='orange';
    }
    else{
      status = 'สมัครได้';
      cls='green';
    }

    return `
      <div class="card">

        <h2>${r.subject}</h2>

        <p>จำนวนรับ: ${r.cap} คน</p>

        <p>สมัครแล้ว: ${r.reg} คน</p>

        <p>สำรอง: ${r.reserve} คน</p>

        <p>คงเหลือ: ${left} คน</p>

        <div class="status ${cls}">
          ● ${status}
        </div>

      </div>
    `;

  }).join('');
}

loadData();

</script>

</body>
</html>
